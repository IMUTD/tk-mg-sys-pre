name: tk-mg

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - redis-data:/data
    networks: [backend]

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    restart: unless-stopped
    command:
      ["sh", "-ec", "bun --cwd apps/api node_modules/drizzle-kit/bin.cjs migrate --config=drizzle.config.ts && exec bun apps/api/src/main.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_URL_ENCODED}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD_URL_ENCODED}@redis:6379/0
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      TK_MG_SYSTEM_ACTOR_ID: ${TK_MG_SYSTEM_ACTOR_ID}
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const response=await fetch('http://127.0.0.1:3000/ready');if(!response.ok)process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [backend]

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_URL_ENCODED}@postgres:5432/${POSTGRES_DB}
      TK_MG_SYSTEM_ACTOR_ID: ${TK_MG_SYSTEM_ACTOR_ID}
      TK_MG_WORKER_ID: ${TK_MG_WORKER_ID:-worker-1}
      TK_MG_WORKER_CONCURRENCY: ${TK_MG_WORKER_CONCURRENCY:-4}
      TK_MG_WORKER_POLL_INTERVAL_MS: ${TK_MG_WORKER_POLL_INTERVAL_MS:-1000}
      TK_MG_WORKER_OUTBOX_BATCH_SIZE: ${TK_MG_WORKER_OUTBOX_BATCH_SIZE:-20}
      TK_MG_WORKER_RECOVERY_BATCH_SIZE: ${TK_MG_WORKER_RECOVERY_BATCH_SIZE:-20}
      TK_MG_WORKER_LEASE_MS: ${TK_MG_WORKER_LEASE_MS:-30000}
      TK_MG_WORKER_HEARTBEAT_MS: ${TK_MG_WORKER_HEARTBEAT_MS:-10000}
      TK_MG_WORKER_RETRY_DELAY_MS: ${TK_MG_WORKER_RETRY_DELAY_MS:-1000}
      TK_MG_WORKER_HEALTH_FILE: /tmp/tk-mg-worker-ready
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "apps/worker/src/health-check.ts"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    networks: [backend]

  bootstrap-admin:
    profiles: ["bootstrap"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    restart: "no"
    command: ["bun", "apps/api/src/bootstrap-admin.ts"]
    environment:
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_URL_ENCODED}@postgres:5432/${POSTGRES_DB}
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS}:${WEB_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
